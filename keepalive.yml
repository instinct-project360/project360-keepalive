name: keepalive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping PROJECT360 demo
        run: |
          code=$(curl -sS -m 90 -o /dev/null -w '%{http_code}' https://project360.ddnsfree.com/health || true)
          echo "health: $code"
          curl -sS -m 120 -o /dev/null -w 'home: %{http_code} in %{time_total}s\n' https://project360.ddnsfree.com/
